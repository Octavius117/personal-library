name: MyBookshelf Rebuild Tests
on:
  push:
    branches: [rebuild-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ISBN catalog logic
        run: node --test catalog.test.mjs
